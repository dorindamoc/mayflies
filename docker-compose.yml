services:
  mayflies:
    build: .
    restart: unless-stopped
    # a prompt can take many minutes; on stop the scheduler finishes the current one, so give it time
    stop_grace_period: 20m
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./memory:/app/memory
      - ./messages:/app/messages
      - ./website:/app/website

  # Ollama on the host must listen beyond loopback to be reachable from the container:
  #   OLLAMA_HOST=0.0.0.0 ollama serve        (macOS app: launchctl setenv OLLAMA_HOST 0.0.0.0, restart it)
  # When using the bundled service below, also set OLLAMA_HOST=http://ollama:11434 in .env.
  #
  # Optional bundled Ollama for Linux/GPU hosts (Docker on macOS cannot use Metal):
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull qwen3.8:27b
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama: {}
